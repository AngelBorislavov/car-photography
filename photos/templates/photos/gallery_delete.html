{% extends "pages/base.html" %}
{% block content %}
<h1>Delete {{ photo.title }}?</h1>
<p>This action cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete the photo</button>
    <a class="btn btn-secondary" href="{% url 'gallery' %}">Cancel</a>
</form>
{% endblock %}

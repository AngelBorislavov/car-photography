{% extends "pages/base.html" %}
    {% block content %}
    {% load static %}
<h1>Add New Photographer</h1>
<form method="post">
    {% csrf_token %}
    <p>{{ form.name}}</p>
    <p>{{ form.email }}</p>
    <p>{{ form.biography }}</p>
     <button class="btn btn-primary" type="submit">Add photographer</button>
</form>

    {% endblock %}

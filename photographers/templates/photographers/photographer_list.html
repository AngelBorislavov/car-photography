<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographers</title>
</head>
<body>
    <h1>Photographers</h1>
    <ul>
    {% for p in photographers %}
            <li>{{p.name}}</li>        
    {% empty %}
        <li>No photographers added yet.</li>
    {% endfor %}
    </ul>
    <hr>
    <h2>Add New Photographer</h2>
        <form method="post">
            {% csrf_token %}
            <p>{{ form.name}}</p>
            <p>{{ form.email }}</p>
            <p>{{ form.biography }}</p>
            <button type="submit">Add photographer</button>
        </form>
</body>
</html>
